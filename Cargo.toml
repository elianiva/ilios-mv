[package]
name = "ilios"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fframes = { version = "=1.4.2-rc.1", features = ["compile-time-svgtree", "cli", "3d", "wgpu", "captions"] }
fframes_skia_renderer = { version = "=1.4.2-rc.1", features = ["metal"] }
fframes_native_player = { version = "=1.4.2-rc.1", default-features = false, features = ["metal", "audio"] }

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.4.2-rc.1", features = ["h264", "libav-agree-gpl", "videotoolbox"] }

[lib]
name = "ilios"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "ilios"
path = "src/main.rs"

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

